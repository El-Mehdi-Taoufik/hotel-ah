name: Regenerate package lock

on:
  push:
    branches:
      - chore/remove-electron

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-electron
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -e
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            rm -f .github/workflows/regenerate-lock.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/regenerate-lock.yml
            git diff --cached --quiet || git commit -m "chore: remove temporary lock regeneration workflow"
            git push
            exit 0
          fi

          rm -f .github/workflows/regenerate-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/regenerate-lock.yml
          git commit -m "chore: regenerate lockfile after removing Electron"
          git push

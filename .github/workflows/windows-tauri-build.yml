name: Windows Tauri Production Build

on:
  push:
    branches:
      - fix/tauri-production-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri installer
        run: npm run build:tauri
        env:
          CI: true

      - name: Verify packaged resources
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/resources/standalone/server.js",
            "src-tauri/resources/prisma/production.db",
            "src-tauri/resources/node/node.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required build resource: $path" }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: hotel-aguelmam-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

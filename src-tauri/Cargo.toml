[package]
name = "hotel-m"
version = "0.1.0"
description = "Hotel Aguelmam — desktop shell"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Needed at runtime to resolve a free-ish TCP port and poll server readiness.
# (std::net is enough for both, so no extra crates required.)

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
